# build.yml - CI validation on push/PR: compile the Tauri app (NSIS).
# The release flow (v* tags) is `release.yml`, generated by dsh-release.

name: build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install Rust toolchain (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri CLI
        run: npm install

      - name: Build Tauri app (NSIS)
        run: npm run tauri -- build

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
