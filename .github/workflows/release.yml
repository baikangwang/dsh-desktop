# release.yml - generated by dsh-release (do not edit manually)
name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install Rust toolchain (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri CLI
        run: npm install

      - name: Assert tag matches tauri.conf.json version
        shell: bash   # windows runners default to pwsh; the assert is bash syntax
        run: |
          APP_VERSION="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$APP_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::tag ($TAG_VERSION) != app version ($APP_VERSION)"
            exit 1
          fi

      - name: Build (NSIS installer)
        run: "npm run tauri -- build"

      - name: Create / update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          $Artifacts = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName }
          if ($Artifacts.Count -eq 0) { Write-Error "no NSIS installer produced"; exit 1 }
          if (gh release view "$TAG" --repo "${{ github.repository }}" >$null 2>&1) {
            gh release upload "$TAG" $Artifacts --repo "${{ github.repository }}" --clobber
            echo "Release $TAG updated with artifacts."
          } else {
            gh release create "$TAG" $Artifacts --repo "${{ github.repository }}" --title "$TAG" --notes "dsh-desktop $TAG — Windows 安装包（NSIS, per-user）。"
            echo "Release $TAG created."
          }
