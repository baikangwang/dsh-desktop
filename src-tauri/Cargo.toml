[package]
name = "dsh-desktop"
version = "0.1.1"
description = "DeepSeek Harness desktop shell (Tauri 2): hosts `dsh web` with lifecycle, tray, and self-update."
authors = ["baikangwang"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "dsh_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-process = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "time", "sync", "io-util", "macros", "rt-multi-thread"] }
regex = "1"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"

# Shell upgrades are offline-package overwrites (no updater plugin); dsh
# upgrades happen at startup via npx (see dsh_manager.rs).

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
