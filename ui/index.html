<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DeepSeek Harness</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: grid; place-items: center;
      background: #0d1117; color: #c9d1d9;
      font-family: "Segoe UI", system-ui, sans-serif;
      -webkit-user-select: none; user-select: none;
    }
    .card { text-align: center; max-width: 640px; width: 90%; }
    .logo { font-size: 44px; letter-spacing: 2px; font-weight: 700; color: #e6edf3; }
    .spinner {
      width: 28px; height: 28px; margin: 28px auto 12px;
      border: 3px solid #30363d; border-top-color: #58a6ff; border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .status { font-size: 13px; color: #8b949e; min-height: 18px; margin-bottom: 12px; }
    .log {
      text-align: left; margin: 0 auto; max-height: 280px; overflow-y: auto;
      padding: 10px 12px; border: 1px solid #21262d; border-radius: 8px;
      background: #161b22; color: #8b949e;
      font-family: Consolas, "Courier New", monospace; font-size: 11px;
      line-height: 1.5; white-space: pre-wrap; word-break: break-all;
      display: none;
    }
    .log.visible { display: block; }
    .hint { margin-top: 24px; font-size: 12px; color: #6e7681; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">DeepSeek Harness</div>
    <div class="spinner"></div>
    <div class="status" id="status">正在准备 DSH 运行时…</div>
    <pre class="log" id="log"></pre>
    <div class="hint">首次启动需要安装/更新 DSH 运行时，请稍候；如长时间停留请查看日志或从托盘重启</div>
  </div>
  <script>
    // Splash + install-progress page: polls the shell's boot progress and
    // renders phase / message / streamed npm output. The window navigates to
    // the DSH URL once the runtime is ready.
    const statusEl = document.getElementById('status');
    const logEl = document.getElementById('log');
    let lastLineCount = 0;

    async function refresh() {
      try {
        const p = await window.__TAURI__.core.invoke('get_boot_progress');
        if (p && p.message) statusEl.textContent = p.message;
        if (p && Array.isArray(p.lines) && p.lines.length) {
          logEl.textContent = p.lines.join('\n');
          logEl.scrollTop = logEl.scrollHeight;
          if (p.lines.length !== lastLineCount) {
            lastLineCount = p.lines.length;
            logEl.classList.add('visible');
          }
        }
      } catch (e) { /* invoke not available yet (pre-webview-ready) */ }
    }
    refresh();
    setInterval(refresh, 600);
  </script>
</body>
</html>
