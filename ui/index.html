<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DeepSeek Harness</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: grid; place-items: center;
      background: #0d1117; color: #c9d1d9;
      font-family: "Segoe UI", system-ui, sans-serif;
      -webkit-user-select: none; user-select: none;
    }
    .card { text-align: center; max-width: 360px; }
    .logo { font-size: 44px; letter-spacing: 2px; font-weight: 700; color: #e6edf3; }
    .spinner {
      width: 28px; height: 28px; margin: 28px auto 12px;
      border: 3px solid #30363d; border-top-color: #58a6ff; border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .status { font-size: 13px; color: #8b949e; min-height: 18px; }
    .hint { margin-top: 24px; font-size: 12px; color: #6e7681; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">DeepSeek Harness</div>
    <div class="spinner"></div>
    <div class="status" id="status">正在启动 dsh web…</div>
    <div class="hint">如果长时间停留在此页，请查看日志或从托盘重启服务</div>
  </div>
  <script>
    // Optional live status: the Rust side pushes state snapshots here when ready.
    // P1 keeps it passive — the window navigates to the DSH URL once ready.
    window.addEventListener('dsd-status', (e) => {
      const s = e.detail || {};
      const el = document.getElementById('status');
      if (el) el.textContent = s.message || el.textContent;
    });
  </script>
</body>
</html>
